name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$') {
            throw "Invalid release tag '$tag'. Expected format: vMAJOR.MINOR.PATCH[-prerelease]"
          }
          $version = $Matches[1]
          $prerelease = if ($version -like '*-*') { 'true' } else { 'false' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DPOPTAPPO_VERSION=$env:VERSION"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Stage portable executable
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/PopTappo.exe "release/PopTappo-$env:VERSION-Windows-x64-Portable.exe"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $defaultIscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (Test-Path $defaultIscc) {
              $iscc = $defaultIscc
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc `
            "/DAppVersion=$env:VERSION" `
            "/DSourceExe=..\dist\PopTappo.exe" `
            "/DOutputDir=..\release" `
            "/DOutputBaseFilename=PopTappo-$env:VERSION-Windows-x64-Setup" `
            packaging/PopTappo.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "PopTappo-$env:VERSION-Windows-x64-Portable.exe",
            "PopTappo-$env:VERSION-Windows-x64-Setup.exe"
          )
          $lines = foreach ($name in $files) {
            $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $assets = @(
            "release/PopTappo-$env:VERSION-Windows-x64-Portable.exe",
            "release/PopTappo-$env:VERSION-Windows-x64-Setup.exe",
            "release/SHA256SUMS.txt"
          )
          gh release view "$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" @assets --clobber
          } else {
            $releaseArgs = @('--title', $env:TAG, '--generate-notes')
            if ($env:PRERELEASE -eq 'true') {
              $releaseArgs += '--prerelease'
            }
            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              $releaseArgs += @('--target', $env:GITHUB_SHA)
            }
            gh release create "$env:TAG" @assets @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
