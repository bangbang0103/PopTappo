name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$') {
            throw "Invalid release tag '$tag'. Expected format: vMAJOR.MINOR.PATCH[-prerelease]"
          }
          $version = $Matches[1]
          $prerelease = if ($version -like '*-*') { 'true' } else { 'false' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DPOPTAPPO_VERSION=$env:VERSION"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Stage portable executable
        shell: pwsh
        run: cmake --install build --config Release --prefix dist

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PopTappo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PopTappo.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh release view "$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" dist/PopTappo.exe dist/SHA256SUMS.txt --clobber
          } else {
            $releaseArgs = @('--title', $env:TAG, '--generate-notes')
            if ($env:PRERELEASE -eq 'true') {
              $releaseArgs += '--prerelease'
            }
            if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              $releaseArgs += @('--target', $env:GITHUB_SHA)
            }
            gh release create "$env:TAG" dist/PopTappo.exe dist/SHA256SUMS.txt @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
